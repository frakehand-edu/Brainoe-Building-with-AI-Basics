{% extends "base.html" %}
{% block title %}Quiz Setup · Brainoe{% endblock %}
{% block content %}
<div class="narrow-content">
  <p class="eyebrow">Quiz me</p>
  <h1>Choose your quiz length</h1>
  <section class="panel empty-state">
    <h2>You have {{ question_count }} questions ready</h2>
    <p class="muted">Choose how many questions you want to answer.</p>
    <form class="quiz-length-form" method="post">
      {% for count in (5, 10, 15) %}
        <label class="length-option"><input type="radio" name="question_count" value="{{ count }}" required><span>{{ count }} questions</span></label>
      {% endfor %}
      <button class="button button-primary button-large" type="submit">Start quiz</button>
    </form>
  </section>
</div>
{% endblock %}
