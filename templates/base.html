<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Brainoe{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="{{ url_for('overview') }}">
        <span class="brand-mark" aria-hidden="true">🧠</span>
        <span>Brainoe</span>
      </a>
      <nav class="nav-links" aria-label="Main navigation">
        <a class="{{ 'active' if request.endpoint == 'overview' else '' }}" href="{{ url_for('overview') }}">Overview</a>
        <a class="{{ 'active' if request.endpoint in ('question_bank', 'manual_question') else '' }}" href="{{ url_for('question_bank') }}">Question Bank</a>
        <a class="{{ 'active' if request.endpoint == 'history' else '' }}" href="{{ url_for('history') }}">History</a>
      </nav>
    </header>
    <main class="page-shell">
      {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
          <div class="flash-stack" aria-live="polite">
            {% for category, message in messages %}
              <div class="flash flash-{{ category }}">{{ message }}</div>
            {% endfor %}
          </div>
        {% endif %}
      {% endwith %}
      {% block content %}{% endblock %}
    </main>
  </body>
</html>
